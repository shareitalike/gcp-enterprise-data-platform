[project]
name = "commerce360-gcp"
version = "0.1.0"
description = "GCP Commerce360 — Multi-Project E-Commerce Analytics Platform"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    # Data generation
    "faker>=26.0.0",
    "numpy>=1.26.0",
    # GCP SDKs
    "google-cloud-storage>=2.16.0",
    "google-cloud-bigquery>=3.25.0",
    "google-cloud-pubsub>=2.22.0",
    "google-cloud-secret-manager>=2.20.0",
    # Apache Beam (Dataflow)
    "apache-beam[gcp]>=2.57.0",
    # Data handling
    "pyarrow>=16.0.0",
    "pandas>=2.2.0",
    "jsonschema>=4.22.0",
    "pydantic>=2.7.0",
    # Config / CLI
    "pyyaml>=6.0.1",
    "click>=8.1.7",
    "python-dotenv>=1.0.1",
    # Quality / testing support
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "black>=24.4.0",
    "pre-commit>=3.7.0",
]

[project.scripts]
c360-generate = "data_generator.generator:main"

[build-system]
requires = ["setuptools>=70.0.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["."]
include = ["data_generator*", "ingestion*", "pipelines*", "quality*"]

# ── Ruff (linter) ─────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]  # line length enforced by formatter, not linter

# ── Black (formatter) ─────────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py311"]

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "unit: fast, no GCP dependencies",
    "integration: requires GCP credentials",
    "e2e: full pipeline, explicit approval required",
]

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
