name: CI — Commerce360

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint-and-test:
    name: Lint, Format, Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Unit tests
        run: pytest tests/unit/ -m unit -v --tb=short
        env:
          C360_ENV: local

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Terraform fmt check — ingestion-dev
        run: terraform fmt -check -recursive
        working-directory: infra/terraform

      - name: Terraform init + validate — ingestion-dev
        run: |
          terraform init -backend=false
          terraform validate
        working-directory: infra/terraform/environments/ingestion-dev

      - name: Terraform init + validate — analytics-dev
        run: |
          terraform init -backend=false
          terraform validate
        working-directory: infra/terraform/environments/analytics-dev

  terraform-plan:
    name: Terraform Plan (GCP auth via WIF)
    runs-on: ubuntu-latest
    # Only run plan on PRs to main; requires WIF setup (Phase 9)
    if: github.event_name == 'pull_request'
    needs: terraform-validate

    permissions:
      contents: read
      id-token: write   # required for Workload Identity Federation

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.DEPLOY_SA_EMAIL }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Terraform Plan — analytics-dev
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="prefix=terraform/analytics-dev"
          terraform plan \
            -var="analytics_project_id=${{ secrets.ANALYTICS_PROJECT_ID }}" \
            -var="ingestion_project_id=${{ secrets.INGESTION_PROJECT_ID }}"
        working-directory: infra/terraform/environments/analytics-dev
